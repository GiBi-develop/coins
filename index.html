<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a collector's cabinet — stats strip, then five drawers: modern Russia, world, USSR, old money, albums; brass on felt */
:root{
  --bg:#f3f1ea; --panel:#fbfaf6; --ink:#1f2420; --muted:#626a62; --line:#d9d6cb;
  --brass:#9a6a1c; --brass-soft:#e9d9b8; --felt:#2f5240; --felt-soft:#d5e2d9;
  --miss:#a3402f; --order:#3a62a8; --empty:#e5e2d8;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --panel:#1b231e; --ink:#e7e4da; --muted:#9aa49b; --line:#2f3a33;
  --brass:#d9a752; --brass-soft:#4a3a1d; --felt:#7fb394; --felt-soft:#22352a;
  --miss:#e07a64; --order:#86a9e8; --empty:#26302a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1b231e; --ink:#e7e4da; --muted:#9aa49b; --line:#2f3a33;
  --brass:#d9a752; --brass-soft:#4a3a1d; --felt:#7fb394; --felt-soft:#22352a;
  --miss:#e07a64; --order:#86a9e8; --empty:#26302a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font:700 clamp(28px,4vw,40px)/1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font:500 13px/1.4 var(--body);color:var(--muted);letter-spacing:0;margin-top:6px}
h2{font:700 22px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 14px/1.3 var(--body);margin:0}
button,.btn{font:500 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--brass)}
button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px}
.stat b{display:block;font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--brass)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.view{display:grid;gap:16px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;aspect-ratio:1.9/1;max-width:100%;overflow:hidden}
#map{position:absolute;inset:0}
#map svg{width:100%;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:auto minmax(0,1fr);max-height:560px;min-width:0;overflow:hidden}
.side-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
.side-body{overflow:auto;padding:6px 0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center;padding:5px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;border-radius:0;font-size:14px}
.crow:hover{background:var(--felt-soft)}
.crow .bar{height:6px;background:var(--empty);border-radius:3px;overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--brass)}
.crow b{font:500 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ilist{display:grid;gap:2px;padding:4px 14px 12px}
.gh{padding:10px 14px 0;font:700 15px var(--display)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.irow small{grid-column:1/-1;color:var(--muted);font:12px var(--mono)}
.irow .q{font:12px var(--mono);color:var(--muted)}
.irow img{grid-column:1/-1;max-height:120px;border-radius:6px}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.scard .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.prog .track{height:8px;background:var(--empty);border-radius:4px;overflow:hidden;display:flex}
.prog .track i{background:var(--felt)}.prog .track i.o{background:var(--order)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;line-height:1.3;padding:3px 7px;border-radius:4px;background:var(--felt-soft);color:var(--ink);border:1px solid transparent}
.chip.missing{background:none;border:1px dashed var(--miss);color:var(--miss)}
.chip.ordered{background:none;border:1px solid var(--order);color:var(--order)}
.chip sup{font:10px var(--mono);color:var(--muted);margin-left:2px}
.snote{font-size:12px;color:var(--muted)}
.full{color:var(--felt);font-weight:600}
.albar{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.albar button{display:grid;gap:4px;text-align:left;padding:10px 12px;line-height:1.25}
.albar button b{font:700 15px/1.2 var(--display)}
.albar button span{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.albar button[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);background:var(--brass-soft)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.sheet-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sheet-h b{font:700 16px var(--display);color:var(--ink)}
.grid{display:grid;gap:3px}
.cell{aspect-ratio:1;border-radius:50%;background:var(--empty);border:1px solid var(--line);font:500 9px/1.1 var(--mono);display:grid;place-items:center;text-align:center;overflow:hidden;color:var(--ink);padding:1px;cursor:default}
.cell.f{background:var(--brass-soft);border-color:var(--brass);cursor:pointer}
.cell.f2{box-shadow:inset 0 0 0 2px var(--brass)}
.nslots{display:grid;gap:6px}
.nslot{border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:13px;background:var(--bg);min-height:38px}
.nslot.f{border-color:var(--felt);background:var(--felt-soft)}
.nslot em{font:11px var(--mono);color:var(--muted);font-style:normal;margin-right:6px}
.loose{font-size:12px;color:var(--muted)}
.loose b{color:var(--ink);font-weight:500}
.detail{background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:12px 14px}
.msg{font-size:13px;color:var(--muted)}
/* jsvectormap essentials */
.jvm-tooltip{position:absolute;display:none;z-index:50;background:var(--ink);color:var(--bg);font:12px/1.4 var(--body);padding:6px 9px;border-radius:5px;pointer-events:none;max-width:240px}
.jvm-tooltip.active{display:block}
.jvm-zoom-btn{position:absolute;left:10px;width:24px;height:24px;line-height:22px;text-align:center;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer;font:600 15px var(--mono);user-select:none}
.jvm-zoomin{top:10px}.jvm-zoomout{top:38px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.groups{display:grid;gap:26px}
.group{display:grid;gap:10px}
.group-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-h span{font:12px var(--mono);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.tile b{display:block;font-weight:500;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.tile small{display:block;color:var(--muted);font:12px/1.3 var(--mono)}
.tile .q{font:12px var(--mono);color:var(--muted)}
.mark{width:22px;height:22px;border-radius:50%;background:var(--brass-soft);border:1.5px solid var(--brass)}
.mark.n{width:30px;height:17px;border-radius:2px;background:var(--felt-soft);border-color:var(--felt)}
.lead{font-size:14px;color:var(--muted);max-width:70ch;margin:0}
.lead b{color:var(--ink);font:500 14px var(--mono)}
.crow.ru{grid-template-columns:minmax(0,1fr) auto 20px;padding-block:9px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Монетный кабинет<small id="updated">Коллекция монет и банкнот</small></h1>
  </header>
  <section class="stats" id="stats"></section>
  <nav role="tablist">
    <button role="tab" data-v="russia" aria-selected="true">Современная Россия</button>
    <button role="tab" data-v="world" aria-selected="false">Иностранные</button>
    <button role="tab" data-v="ussr" aria-selected="false">СССР</button>
    <button role="tab" data-v="old" aria-selected="false">Старые</button>
    <button role="tab" data-v="albums" aria-selected="false">Альбомы</button>
  </nav>

  <section class="view" id="v-russia"></section>

  <section class="view" id="v-world" hidden>
    <p class="lead" id="worldlead"></p>
    <div class="mapgrid">
      <div class="view" style="gap:8px">
        <div class="mapbox"><div id="map"></div></div>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="side" id="side"></aside>
    </div>
  </section>

  <section class="view" id="v-ussr" hidden></section>
  <section class="view" id="v-old" hidden></section>

  <section class="view" id="v-albums" hidden>
    <div class="albar" id="albar"></div>
    <div id="aldetail"></div>
    <div class="sheets" id="sheets"></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null, selCountry=null, curAlbum=null, vmap=null, mapDirty=true;
const VIEWS=["russia","world","ussr","old","albums"];
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

async function boot(){
  try{const r=await fetch("collection.json",{cache:"no-store"});if(!r.ok)throw 0;D=await r.json()}
  catch(e){D=JSON.parse($("#seed").textContent)}
  $("#updated").textContent="Коллекция монет и банкнот · обновлено "+(D.updated||"—");
  renderAll();
}

const have=it=>it.status==="have";
const pcs=l=>l.filter(have).reduce((a,i)=>a+(i.qty||0),0);
const cname=c=>c?(D.countries[c]?.name||c):"Неопознанные";
const yearOf=it=>{const m=String(it.year||"").match(/\d{4}/);return m?+m[0]:null};
const OLD_ISSUERS=["Русское царство","Российская империя","Временное правительство","РСФСР","Римская империя","Германская империя","Веймарская республика","Бавария","Третий рейх"];
function era(it){
  const y=yearOf(it);
  if(it.series==="ussr") return (it.issuer==="СССР")?"ussr":"old";
  if(OLD_ISSUERS.includes(it.issuer)) return "old";
  if(it.country==="RU"){
    if(it.issuer==="СССР") return "ussr";
    if(y&&y<1922) return "old";
    if(y&&y<=1991) return "ussr";
    return "russia";
  }
  if(y&&y<1945) return "old";
  return "world";
}
const albumName=id=>{const a=D.albums.find(a=>a.id===id)||{};return a.short||a.name||id};

function renderAll(){renderStats();renderRussia();renderWorldLead();renderSide();drawMap();renderGroupsView("ussr");renderGroupsView("old");renderAlbums()}

function seriesProgress(s){
  const its=D.items.filter(i=>i.series===s.id);
  const h=its.filter(have).length+(s.extra_have||0), o=its.filter(i=>i.status==="ordered").length, m=its.filter(i=>i.status==="missing").length;
  return {its,have:h,ordered:o,missing:m,total:s.total||((m||o)?h+o+m:null)};
}
function renderStats(){
  const its=D.items, extra=D.series.reduce((a,s)=>a+(s.extra_have||0),0);
  const coins=pcs(its.filter(i=>i.kind!=="banknote"))+extra, notes=pcs(its.filter(i=>i.kind==="banknote"));
  const ctr=new Set(its.filter(i=>have(i)&&i.country&&i.country!=="EU").map(i=>i.country)).size;
  const sp=D.series.map(seriesProgress).filter(p=>p.total), full=sp.filter(p=>p.have>=p.total).length;
  $("#stats").innerHTML=[[coins,"монет"],[notes,"банкнот"],[ctr,"стран"],[full+" из "+sp.length,"серий собрано"]]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

/* ---------- tiles ---------- */
function tile(it,showCountry){
  const sub=[it.year,showCountry?cname(it.country):""].filter(Boolean).join(" · ");
  return `<div class="tile" title="${esc(it.name)}"><span class="mark ${it.kind==="banknote"?"n":""}"></span><span><b>${esc(it.name)}</b>${sub?`<small>${esc(sub)}</small>`:""}</span><span class="q">${it.qty>1?"×"+it.qty:""}</span></div>`;
}
function group(title,list,showCountry){
  if(!list.length)return "";
  const c=pcs(list.filter(i=>i.kind!=="banknote")), n=pcs(list.filter(i=>i.kind==="banknote"));
  const meta=[c?c+" мон.":"",n?n+" банкн.":""].filter(Boolean).join(" · ");
  return `<div class="group"><div class="group-h"><h2>${esc(title)}</h2><span>${meta}</span></div><div class="tiles">${list.map(i=>tile(i,showCountry)).join("")}</div></div>`;
}
const byYear=(a,b)=>(yearOf(a)||9999)-(yearOf(b)||9999);

/* ---------- Modern Russia ---------- */
const RU_SKIP=["ussr","tsar","rsfsr","reich"];
function renderRussia(){
  const cards=D.series.filter(s=>!RU_SKIP.includes(s.id)).map(s=>{
    const p=seriesProgress(s), done=p.total&&p.have>=p.total;
    const bar=p.total?`<div class="prog"><span class="track"><i style="width:${p.have/p.total*100}%"></i><i class="o" style="width:${p.ordered/p.total*100}%"></i></span><span>${p.have} / ${p.total}</span></div>`
      :`<div class="prog"><span class="snote">${p.have} в коллекции</span><span></span></div>`;
    const chips=p.its.map(i=>`<span class="chip ${i.status!=="have"?i.status:""}">${esc(i.name)}${i.year&&i.year.length<6&&!/\d{4}/.test(i.name)?" "+esc(i.year):""}${i.qty>1?`<sup>×${i.qty}</sup>`:""}</span>`).join("");
    return `<article class="scard"><div class="meta">${esc(s.denom||"")}</div><h2>${esc(s.name)}</h2>${bar}${done?`<span class="full">Собрана полностью</span>`:""}${chips?`<div class="chips">${chips}</div>`:""}${s.note?`<p class="snote">${esc(s.note)}</p>`:""}</article>`;
  }).join("");
  const rest=D.items.filter(i=>have(i)&&era(i)==="russia"&&!i.series);
  $("#v-russia").innerHTML=`<div class="groups"><div class="group"><div class="group-h"><h2>Серии</h2><span>пунктир — нет в коллекции</span></div><div class="series">${cards}</div></div>
    ${group("Другие памятные монеты",rest.filter(i=>i.kind!=="banknote").sort(byYear))}
    ${group("Банкноты Банка России",rest.filter(i=>i.kind==="banknote").sort(byYear))}</div>`;
}

/* ---------- USSR / Old ---------- */
function renderGroupsView(v){
  const its=D.items.filter(i=>have(i)&&era(i)===v).sort(byYear);
  let html="";
  if(v==="ussr"){
    html+=group("Монеты",its.filter(i=>i.kind!=="banknote"));
    const notes=its.filter(i=>i.kind==="banknote"), yrs={};
    notes.forEach(i=>{const y=yearOf(i)||"—";(yrs[y]=yrs[y]||[]).push(i)});
    Object.keys(yrs).sort().forEach(y=>html+=group("Банкноты "+y+" года",yrs[y]));
  }else{
    const order=["Русское царство","Российская империя","Временное правительство","РСФСР"];
    const g={};its.forEach(i=>{const k=i.country==="RU"?(i.issuer||"Россия"):(i.issuer||cname(i.country));(g[k]=g[k]||[]).push(i)});
    const keys=Object.keys(g).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||yearOf(g[a][0])-yearOf(g[b][0])});
    keys.forEach(k=>html+=group(k,g[k],!order.includes(k)));
  }
  $("#v-"+v).innerHTML=`<div class="groups">${html||'<p class="lead">Пока пусто.</p>'}</div>`;
}

/* ---------- World ---------- */
const ruExtra=()=>D.series.reduce((a,s)=>a+(s.extra_have||0),0);
const cpcs=(c,l)=>pcs(l)+(c==="RU"?ruExtra():0);
function byCountry(){const m={};for(const it of D.items){if(!have(it))continue;const c=it.country||"";(m[c]=m[c]||[]).push(it)}return m}
function renderWorldLead(){
  const m=byCountry(), all=Object.values(m).flat();
  const n=Object.keys(m).filter(c=>c&&c!=="EU").length;
  $("#worldlead").innerHTML=`Монеты и банкноты из <b>${n}</b> стран, включая Россию. Нажмите на страну, чтобы увидеть, что из неё есть.`;
}
function itemRow(it){
  return `<div class="irow"><span>${esc(it.name)}${it.year?", "+esc(it.year):""}</span><span class="q">${it.qty>1?"×"+it.qty:""}</span>${it.image?`<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy">`:""}</div>`;
}
function renderSide(){
  const side=$("#side"), m=byCountry();
  if(selCountry==="RU"&&m.RU){
    const sec=[["russia","Современная Россия"],["ussr","СССР"],["old","Старые"]].map(([v,l])=>{
      const list=m.RU.filter(i=>era(i)===v), c=pcs(list.filter(i=>i.kind!=="banknote"))+(v==="russia"?ruExtra():0), n=pcs(list.filter(i=>i.kind==="banknote"));
      return `<button class="crow ru" data-go="${v}"><span>${l}</span><span class="snote">${[c?c+" мон.":"",n?n+" банкн.":""].filter(Boolean).join(" · ")}</span><b>→</b></button>`}).join("");
    side.innerHTML=`<div class="side-head"><h2>Россия</h2><button id="back">Все страны</button></div><div class="side-body"><p class="snote" style="padding:4px 14px">Российская часть коллекции разбита на три раздела:</p>${sec}</div>`;
    $("#back").onclick=()=>{selCountry=null;renderSide()};
    side.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{show(b.dataset.go);window.scrollTo(0,0)});
    return;
  }
  if(selCountry!==null&&m[selCountry]){
    const list=m[selCountry].slice().sort(byYear), base=cname(selCountry), groups={};
    list.forEach(i=>{const k=i.issuer||base;(groups[k]=groups[k]||[]).push(i)});
    const gk=Object.keys(groups).sort((a,b)=>(a!==base)-(b!==base));
    side.innerHTML=`<div class="side-head"><h2>${esc(base)}</h2><button id="back">Все страны</button></div>
      <div class="side-body">${gk.map(g=>`${gk.length>1?`<h3 class="gh">${esc(g)}</h3>`:""}${["coin","banknote"].map(k=>{const l=groups[g].filter(i=>(i.kind==="banknote")===(k==="banknote"));return l.length?`<div class="ilist"><span class="snote">${k==="banknote"?"Банкноты":"Монеты"}</span>${l.map(itemRow).join("")}</div>`:""}).join("")}`).join("")}</div>`;
    $("#back").onclick=()=>{selCountry=null;renderSide()};
    return;
  }
  const rows=Object.entries(m).map(([c,l])=>[c,cpcs(c,l)]).sort((a,b)=>(a[0]==="")-(b[0]==="")||b[1]-a[1]);
  const max=Math.log(Math.max(...rows.map(r=>r[1]),1)+1);
  side.innerHTML=`<div class="side-head"><h2>Страны</h2><span class="snote">${rows.length}</span></div>
    <div class="side-body">${rows.map(([c,n])=>`<button class="crow" data-c="${esc(c)}"><span>${esc(cname(c))}</span><span class="bar"><i style="width:${Math.log(n+1)/max*100}%"></i></span><b>${n}</b></button>`).join("")}</div>`;
  side.querySelectorAll(".crow").forEach(b=>b.onclick=()=>{selCountry=b.dataset.c;renderSide()});
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const BINS=[[1,"1"],[2,"2–5"],[6,"6–15"],[16,"16–40"],[41,"больше 40"]];
function bin(n){let b=0;BINS.forEach(([lo],i)=>{if(n>=lo)b=i});return b}
function hex(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function binColors(){const a=hex(css("--brass-soft")),b=hex(css("--brass"));return BINS.map((_,i)=>{const k=i/(BINS.length-1);return "#"+a.map((v,j)=>Math.round(v+(b[j]-v)*k).toString(16).padStart(2,"0")).join("")})}
function countryCounts(){const m=byCountry(),o={};for(const c in m)if(c&&D.countries[c]&&D.countries[c].lat!=null)o[c]=cpcs(c,m[c]);return o}
function legend(){$("#legend").innerHTML="Экземпляров: "+BINS.map(([,l],i)=>`<span><i style="background:${binColors()[i]}"></i>${l}</span>`).join("")}
function dotMap(){
  legend();
  const el=$("#map"), counts=countryCounts();
  let g="";for(let x=0;x<=360;x+=30)g+=`<line x1="${x}" y1="0" x2="${x}" y2="180"/>`;for(let y=0;y<=180;y+=30)g+=`<line x1="0" y1="${y}" x2="360" y2="${y}"/>`;
  const dots=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>{const k=D.countries[c];const r=1.4+3.6*Math.sqrt(bin(n)/4);
    return `<circle cx="${k.lon+180}" cy="${90-k.lat}" r="${r}" data-c="${c}" fill="${binColors()[bin(n)]}" stroke="var(--panel)" stroke-width=".3" style="cursor:pointer"><title>${esc(k.name)}: ${n} шт.</title></circle>`}).join("");
  el.innerHTML=`<svg viewBox="0 8 360 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Страны коллекции"><g stroke="var(--line)" stroke-width=".3" fill="none">${g}</g>${dots}</svg>`;
  el.querySelectorAll("circle").forEach(c=>c.onclick=()=>{selCountry=c.dataset.c;renderSide()});
}
const MAPLIBS=[
  ["https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js","https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"],
  ["https://unpkg.com/jsvectormap@1.5.3/dist/js/jsvectormap.min.js","https://unpkg.com/jsvectormap@1.5.3/dist/maps/world.js"],
  ["https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/jsvectormap.min.js","https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js"],
];
function addScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
let libReady=null;
function loadLib(){if(libReady)return libReady;libReady=(async()=>{for(const [a,b] of MAPLIBS){try{if(!window.jsVectorMap)await addScript(a);await addScript(b);if(window.jsVectorMap)return true}catch(e){}}return false})();return libReady}
async function drawMap(){
  if($("#v-world").hidden){mapDirty=true;return}
  mapDirty=false; dotMap();
  if(!await loadLib())return;
  try{
    $("#map").innerHTML="";
    const counts=countryCounts(), cols=binColors();
    const opts={selector:"#map",map:"world",zoomButtons:true,zoomOnScroll:false,
      regionStyle:{initial:{fill:css("--empty"),stroke:css("--line"),strokeWidth:.4,fillOpacity:1},hover:{fillOpacity:.75,cursor:"pointer"}},
      series:{regions:[{attribute:"fill",scale:Object.fromEntries(cols.map((c,i)=>[String(i),c])),values:Object.fromEntries(Object.entries(counts).map(([c,n])=>[c,String(bin(n))]))}]},
      markerStyle:{initial:{fill:css("--brass"),stroke:css("--panel"),strokeWidth:1.5,r:5},hover:{cursor:"pointer",fillOpacity:.8}},
      onRegionTooltipShow(ev,tip,code){const n=counts[code];tip.text((D.countries[code]?.name||tip.text())+(n?": "+n+" шт.":""))},
      onRegionClick(ev,code){if(counts[code]){selCountry=code;renderSide()}},
    };
    vmap=new jsVectorMap(opts);
    const regs=vmap.regions||{}, small=Object.keys(counts).filter(c=>!regs[c]);
    if(small.length){
      try{vmap.destroy&&vmap.destroy()}catch(e){}
      document.querySelectorAll(".jvm-tooltip").forEach(e=>e.remove());
      $("#map").innerHTML="";
      vmap=new jsVectorMap(Object.assign({},opts,{
        markers:small.map(c=>({name:D.countries[c].name+": "+counts[c]+" шт.",coords:[D.countries[c].lat,D.countries[c].lon]})),
        onMarkerClick(ev,i){selCountry=small[+i];renderSide()},
      }));
    }

  }catch(e){dotMap()}
}

/* ---------- Albums ---------- */
function renderAlbums(){
  const albums=D.albums.filter(a=>a.sheets);
  if(!curAlbum)curAlbum=albums[0]?.id;
  $("#albar").innerHTML=albums.map(a=>{
    const its=D.items.filter(i=>i.album===a.id&&have(i));
    const c=pcs(its.filter(i=>i.kind!=="banknote")), n=pcs(its.filter(i=>i.kind==="banknote")), sh=Object.keys(a.sheets).length;
    const parts=[c?c+" мон.":"",n?n+" банкн.":"",sh+" л."].filter(Boolean).join(" · ");
    return `<button aria-pressed="${a.id===curAlbum}" data-a="${a.id}" title="${esc(a.name)}"><b>${esc(a.short||a.name)}</b><span>${parts}</span></button>`}).join("");
  $("#albar").querySelectorAll("button").forEach(b=>b.onclick=()=>{curAlbum=b.dataset.a;$("#aldetail").innerHTML="";renderAlbums()});
  const al=D.albums.find(a=>a.id===curAlbum); if(!al)return;
  const its=D.items.filter(i=>i.album===curAlbum&&have(i));
  const sheets=Object.assign({},al.sheets);
  its.forEach(i=>{if(i.sheet&&!sheets[i.sheet])sheets[i.sheet]={}});
  const keys=Object.keys(sheets).sort((a,b)=>parseFloat(a)-parseFloat(b)||a.localeCompare(b));
  const out=keys.map(k=>sheetCard(k,sheets[k],its.filter(i=>i.sheet===k))).filter(Boolean);
  const loose=its.filter(i=>!i.sheet);
  if(loose.length)out.push(`<div class="sheet"><div class="sheet-h"><b>Другие</b><span>${pcs(loose)} шт.</span></div><div class="ilist" style="padding:0">${loose.map(itemRow).join("")}</div></div>`);
  $("#sheets").innerHTML=out.join("");
  $("#sheets").querySelectorAll("[data-ids]").forEach(c=>c.onclick=()=>showCell(c));
}
function sheetCard(k,lay,its){
  let body="";
  if(lay.slots){
    body=`<div class="nslots">${Array.from({length:lay.slots},(_,i)=>{const at=its.filter(x=>x.slot===i+1);
      return `<div class="nslot ${at.length?"f":""}" ${at.length?`data-ids="${at.map(x=>x.id).join(",")}" tabindex="0"`:""}><em>${i+1}</em>${at.length?at.map(x=>esc(x.name)+(x.year?", "+esc(x.year):"")+(x.qty>1?" ×"+x.qty:"")).join("; "):"пусто"}</div>`}).join("")}</div>`;
    const other=its.filter(x=>!x.slot||x.slot>lay.slots);
    if(other.length)body+=`<p class="loose">Также на листе: ${other.map(x=>"<b>"+esc(x.name)+"</b>").join(", ")}</p>`;
  }else if(lay.rows&&lay.cols){
    const place={}, extra=[], ok=x=>x.row&&x.slot&&x.slot<=lay.cols&&x.row<=lay.rows;
    its.filter(ok).forEach(x=>(place[x.row+":"+x.slot]=place[x.row+":"+x.slot]||[]).push(x));
    const free=r=>{for(let c=1;c<=lay.cols;c++)if(!place[r+":"+c])return c;return 0};
    its.filter(x=>!ok(x)).forEach(x=>{
      let r=x.row&&x.row<=lay.rows?x.row:0, c=r?free(r):0;
      if(!r)for(let rr=1;rr<=lay.rows&&!c;rr++){c=free(rr);if(c)r=rr}
      if(r&&c)place[r+":"+c]=[x];else extra.push(x);
    });
    let cells="";
    for(let r=1;r<=lay.rows;r++)for(let c=1;c<=lay.cols;c++){
      const at=place[r+":"+c]||[];
      cells+=`<div class="cell ${at.length?"f":""} ${at.length>1?"f2":""}" ${at.length?`data-ids="${at.map(x=>x.id).join(",")}" tabindex="0" title="${esc(at.map(x=>cname(x.country)+": "+x.name+(x.year?" "+x.year:"")).join("\n"))}"`:""}>${esc(at.map(x=>x.country||"").join(" "))}</div>`;
    }
    body=`<div class="grid" style="grid-template-columns:repeat(${lay.cols},minmax(0,1fr))">${cells}</div>`;
    if(extra.length)body+=`<p class="loose">Также на листе: ${extra.map(x=>"<b>"+esc(cname(x.country)+" "+x.name)+"</b>").join(", ")}</p>`;
  }else{
    if(!its.length)return "";
    body=`<div class="ilist" style="padding:0">${its.map(itemRow).join("")}</div>`;
  }
  const n=pcs(its);
  return `<div class="sheet"><div class="sheet-h"><b>Лист ${esc(k)}</b><span>${n?n+" шт.":""}</span></div>${body}</div>`;
}
function showCell(c){
  const ids=c.dataset.ids.split(","), its=D.items.filter(i=>ids.includes(i.id));
  $("#aldetail").innerHTML=`<div class="detail"><div class="ilist" style="padding:0">${its.map(i=>itemRow(Object.assign({},i,{name:cname(i.country)+": "+i.name}))).join("")}</div></div>`;
}

/* ---------- Tabs ---------- */
function show(v){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  VIEWS.forEach(x=>$("#v-"+x).hidden=x!==v);
  store("coins:tab",v);
  if(v==="world"&&D&&mapDirty)drawMap();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
const h=location.hash.slice(1);show(VIEWS.includes(h)?h:(VIEWS.includes(load("coins:tab"))?load("coins:tab"):"russia"));
boot();
</script>
